        <p>Monitor, debug, and fix your robot fleet from anywhere. Get instant visibility into what's happening across all your robots with a single cloud dashboard.</p>

        <ul>
          <li><strong>Real-time Fleet Dashboard</strong> - Monitor all robots in one view with instant health status</li>
          <li><strong>AI-Powered Root Cause Analysis</strong> - Automatically identify failure causes instead of manual correlation</li>
          <li><strong>Intelligent Alert Correlation</strong> - Group related alerts and find the actual root cause</li>
          <li><strong>Navigation Debugging</strong> - Full Nav2 stack visibility with timeline replay</li>
          <li><strong>Sensor Drift Detection</strong> - Catch sensor degradation before it causes failures</li>
          <li><strong>OTA Deployment Tracking</strong> - Correlate software deployments with robot failures</li>
          <li><strong>GPU Monitoring</strong> - Per-GPU metrics for inference optimization</li>
